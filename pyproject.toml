[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy"
version = "0.1.0"
description = "NBA lineup synergy with hypergraph neural networks (CS224W)"
requires-python = ">=3.10"
dependencies = [
    "nba_api>=1.11.3",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
